# pharmabridge/k8s/ingress.yaml
# ──────────────────────────────
# Traefik IngressRoute (K3s default) + standard Ingress for compatibility.
# Traffic path:
#   Internet → Cloudflare Tunnel → Traefik (MetalLB LB IP) → Gateway pods
#
# Consumer UI:   https://pharmabridge.bvrinfra.in/
# Operator UI:   https://pharmabridge-ops.bvrinfra.in/
# API:           https://pharmabridge.bvrinfra.in/api/v1/...

# ── Standard Ingress (works with any ingress controller) ──
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharmabridge-ingress
  namespace: pharmabridge
  annotations:
    # Traefik annotations
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.middlewares: "pharmabridge-headers@kubernetescrd"
    # Cert-Manager (if terminating TLS at Traefik instead of Cloudflare)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  rules:
    - host: pharmabridge.bvrinfra.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pharmabridge-gateway-svc
                port:
                  number: 80
    - host: pharmabridge-ops.bvrinfra.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pharmabridge-gateway-svc
                port:
                  number: 80

---
# ── Traefik Middleware: security headers + rate limiting ──
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pharmabridge-headers
  namespace: pharmabridge
spec:
  headers:
    customResponseHeaders:
      X-Frame-Options:        "SAMEORIGIN"
      X-Content-Type-Options: "nosniff"
      Referrer-Policy:        "strict-origin-when-cross-origin"
      X-Powered-By:           ""   # Hide server identity
    contentTypeNosniff: true
    frameDeny:          false      # Allow /operator iframe if needed

---
# ── Traefik Rate Limit Middleware ─────────────────────────
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pharmabridge-ratelimit
  namespace: pharmabridge
spec:
  rateLimit:
    average: 30    # 30 req/s per client IP
    burst:    60   # Allow short bursts
