# pharmabridge/k8s/secrets.yaml
# ──────────────────────────────────────────────────────────────────
# IMPORTANT: This file is a TEMPLATE.
# Never commit real secrets to git.
# 
# Usage:
#   1. Copy to secrets.local.yaml (gitignored)
#   2. Fill in real values as base64: echo -n "value" | base64
#   3. Apply: kubectl apply -f secrets.local.yaml
#
# For production: use Sealed Secrets or External Secrets Operator
#   - Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
#   - ESO with Vault: https://external-secrets.io
#
# Your ArgoCD homelab setup → add sealed-secrets controller,
# then: kubeseal -f secrets.local.yaml -w k8s/secrets-sealed.yaml
# ──────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Secret
metadata:
  name: pharmabridge-app-secret
  namespace: pharmabridge
type: Opaque
data:
  # JWT signing secret – generate with: openssl rand -hex 32 | base64
  JWT_SECRET: "Q0hBTkdFX01FX0lOX1BST0RVQ1RJT04="  # placeholder: CHANGE_ME_IN_PRODUCTION

  # Bootstrap: phone number to promote to ADMIN on first migration run.
  # Base64 of "+919876543210" → change to your actual number.
  # REMOVE THIS KEY from the Secret after the first successful login as ADMIN.
  BOOTSTRAP_ADMIN_PHONE: "KzkxOTg3NjU0MzIxMA=="

  # Access token TTL in minutes (15 = recommended)
  ACCESS_TOKEN_TTL_MINUTES: "MTU="   # 15

  # Refresh token TTL in days
  REFRESH_TOKEN_TTL_DAYS: "Nw=="    # 7

---
apiVersion: v1
kind: Secret
metadata:
  name: pharmabridge-db-secret
  namespace: pharmabridge
type: Opaque
data:
  # All values are base64-encoded. To encode: echo -n "value" | base64
  # To decode: echo "encoded" | base64 -d
  
  POSTGRES_USER:     "cGhhcm1hYnJpZGdl"         # pharmabridge
  POSTGRES_PASSWORD: "Q0hBTkdFX1RISVNfUEFTU1dPUkQ="  # CHANGE_THIS_PASSWORD
  POSTGRES_DB:       "cGhhcm1hYnJpZGdl"         # pharmabridge
  
  # Full async URL for the gateway
  DATABASE_URL: "cG9zdGdyZXNxbCthc3luY3BnOi8vcGhhcm1hYnJpZGdlOkNIQU5HRV9USElTX1BBU1NXT1JEQHBvc3RncmVzLXN2Yy5waGFybWFicmlkZ2Uuc3ZjLmNsdXN0ZXIubG9jYWw6NTQzMi9waGFybWFicmlkZ2U="
  # Decoded: postgresql+asyncpg://pharmabridge:CHANGE_THIS_PASSWORD@postgres-svc.pharmabridge.svc.cluster.local:5432/pharmabridge

---
# Redis auth (optional but recommended for production)
apiVersion: v1
kind: Secret
metadata:
  name: pharmabridge-redis-secret
  namespace: pharmabridge
type: Opaque
data:
  # If you add requirepass to redis.conf, set this
  REDIS_PASSWORD: ""   # empty = no auth (acceptable for cluster-internal Redis)

---
# MinIO object storage credentials
apiVersion: v1
kind: Secret
metadata:
  name: pharmabridge-minio-secret
  namespace: pharmabridge
type: Opaque
data:
  # echo -n "pharmabridge" | base64
  MINIO_ROOT_USER:     "cGhhcm1hYnJpZGdl"
  # echo -n "CHANGE_THIS_STRONG_PASSWORD" | base64
  MINIO_ROOT_PASSWORD: "Q0hBTkdFX1RISVNfU1RST05HX1BBU1NXT1JE"

---
# Oracle Cloud Free Tier offsite backup credentials
# See minio-deployment.yaml for rclone.conf format
apiVersion: v1
kind: Secret
metadata:
  name: pharmabridge-oci-secret
  namespace: pharmabridge
type: Opaque
data:
  OCI_BUCKET:  "cGhhcm1hYnJpZGdlLWRy"    # pharmabridge-dr
  # rclone.conf is injected as a file (see CronJob volumeMount)
  rclone.conf: ""   # base64-encode your rclone.conf and paste here
