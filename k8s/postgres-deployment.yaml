# pharmabridge/k8s/postgres-deployment.yaml
# ──────────────────────────────────────────
# PostgreSQL 16 for pharmabridge.
#
# Production HA path:
#   Single pod is fine for a homelab / Phase-1 commercial launch.
#   When DAU > 5k, migrate to CloudNativePG operator (declarative HA Postgres
#   on K8s with streaming replication and automatic failover).
#   https://cloudnative-pg.io/
#
# Credentials are in a K8s Secret – never in a ConfigMap.
# Create with:
#   kubectl create secret generic pharmabridge-db-secret \
#     --from-literal=POSTGRES_USER=pharmabridge \
#     --from-literal=POSTGRES_PASSWORD=<strongpassword> \
#     --from-literal=POSTGRES_DB=pharmabridge \
#     -n pharmabridge
# ──────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pharmabridge
  labels:
    app: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: pharmabridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # Deploy before gateway or workers
spec:
  replicas: 1
  strategy:
    type: Recreate   # For single-replica DB, Recreate avoids two pods writing to the same PVC
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9187"   # postgres_exporter sidecar
    spec:
      containers:
        # ── PostgreSQL server ─────────────────────────────
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: pharmabridge-db-secret
          env:
            # Performance tuning for a 2-core / 4GB node
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=en_US.UTF-8"
          args:
            - postgres
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=768MB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - max_connections=100
            - -c
            - log_min_duration_statement=1000   # Log slow queries (>1s)
            - -c
            - log_line_prefix=%t [%p] %u@%d
            - -c
            - timezone=UTC
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # Prevents Postgres error about non-empty mount dir
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pharmabridge", "-d", "pharmabridge"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "pharmabridge", "-d", "pharmabridge"]
            initialDelaySeconds: 30
            periodSeconds: 30

        # ── postgres_exporter sidecar (Prometheus metrics) ─
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/pharmabridge?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: pharmabridge-db-secret
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: pharmabridge-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu:    "20m"
              memory: "32Mi"
            limits:
              cpu:    "100m"
              memory: "64Mi"

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: pharmabridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path   # K3s default on Proxmox; use Longhorn for replicated storage

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: pharmabridge
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
  type: ClusterIP

---
# ── Alembic migration Job ─────────────────────────────────
# Runs 'alembic upgrade head' once after each deployment.
# ArgoCD sync-wave 1.5 ensures it runs after postgres is ready
# but before the gateway (sync-wave 2) starts accepting traffic.
apiVersion: batch/v1
kind: Job
metadata:
  name: pharmabridge-db-migrate
  namespace: pharmabridge
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: alembic
          image: bodapati88/pharmabridge-gateway:latest
          command:
            - alembic
            - -c
            - db/migrations/alembic.ini
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pharmabridge-db-secret
                  key: DATABASE_URL
            - name: BOOTSTRAP_ADMIN_PHONE
              valueFrom:
                secretKeyRef:
                  name: pharmabridge-app-secret
                  key: BOOTSTRAP_ADMIN_PHONE
                  optional: true   # missing key = no bootstrap (safe default)
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"
