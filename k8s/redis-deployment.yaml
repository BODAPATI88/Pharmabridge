# pharmabridge/k8s/redis-deployment.yaml
# ─────────────────────────────────────────────────────────────
# Single-replica Redis 7 for dev/staging.
# For production HA, replace with Redis Sentinel or Redis Cluster
# (or use a managed Redis like Upstash / Redis Cloud via Cloudflare).
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: pharmabridge
  labels:
    app: redis
    app.kubernetes.io/part-of: pharmabridge
    app.kubernetes.io/component: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9121"   # redis_exporter sidecar
    spec:
      containers:
        # ── Redis server ──────────────────────────────────────
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - --save 60 1          # RDB snapshot every 60 s if ≥1 key changed
            - --loglevel notice
            - --maxmemory 256mb
            - --maxmemory-policy allkeys-lru   # Evict LRU keys at 256 MB limit
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "300Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: redis-data
              mountPath: /data

        # ── Redis Exporter sidecar (Prometheus metrics) ───────
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.61.0-alpine
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu:    "20m"
              memory: "32Mi"
            limits:
              cpu:    "100m"
              memory: "64Mi"

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: pharmabridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path   # K3s default; change for Proxmox Longhorn etc.

---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: pharmabridge
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 9121
      targetPort: 9121
  type: ClusterIP   # Never expose Redis externally
